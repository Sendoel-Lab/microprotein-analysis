name: mp-seq
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pandas
  - fastp
  - star=2.7.7a
  - bowtie2
  - samtools
  - subread=2.1.1
  - umi_tools>=1.1.1
  - r-base=4.5
  - bioconductor-deseq2=1.50
  - r-ggplot2
  - r-ggrepel
  - r-cowplot
  - r-data.table
  - r-optparse
  - r-viridis
  - r-enrichr=3.4
  - r-ggvenn
  - r-eulerr
  - r-devtools   # riboWaltz: devtools::install_github("LabTranslationalArchitectomics/riboWaltz")
